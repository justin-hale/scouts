id: dolphin
name: Dolphin (GameCube / Wii)
description: >
  Pick Dolphin's user folder, the one that contains "GC" and "Wii". On
  Android, choose "Dolphin" in the folder picker's sidebar (Dolphin exposes
  its user folder there). GameCube saves sync as whole memory cards: either
  raw cards (MemoryCardA.USA.raw) or GCI folders (GC/USA/Card A/*.gci),
  whichever Dolphin is set to use. Wii saves sync per game from the NAND.
defaultPaths:
  windows: ["%USERPROFILE%\\Documents\\Dolphin Emulator", "%APPDATA%\\Dolphin Emulator"]
saves:
  - platforms: ["gc"]
    pattern: "GC/MemoryCard{slot:1}.{region}.raw"
    file: card.raw
  - platforms: ["gc"]
    pattern: "GC/{region}/Card {slot:1}/{file}"
  - platforms: ["wii"]
    pattern: "Wii/title/{category:8}/{titleLow:8}/data/{file**}"
